name: CI

# Every push to main: unit tests on Linux, macOS and Windows (oldest and newest supported Node), then the release
# checks and a real install of the packed package. The end-to-end suite (npm run e2e) needs real paired machines
# on a tailnet, so it runs on yours, not here.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.11', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  release-checks:
    name: package, credentials scan, install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # package.json fields, exactly what npm would publish, and no credentials or personal details in any file
      - run: node tools/check-release.js
      - run: npm audit --omit=dev --audit-level=high
      # Install the packed package like a user would, and run the installed command
      - name: Install the package and run it
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/claude-wingman-*.tgz
          claude-wingman version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          claude-wingman help | grep -q 'claude-wingman run'
          claude-wingman doctor || true
